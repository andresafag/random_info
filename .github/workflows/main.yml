name: Deploy Random Rush to AWS

on:
  push:
    branches:
      - main

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: random-info-app
  LAMBDA_NAME: random-info-web-adapter

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # ==================== SNYK SECURITY SCANS ====================

    - name: Run Snyk to check for vulnerabilities
      uses: snyk/actions/python@master
      continue-on-error: true
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      with:
        command: test
        args: --skip-unresolved=true

    - name: Run Snyk Code to check for code security issues
      uses: snyk/actions/python@master
      continue-on-error: true
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      with:
        command: code test
        args: --org=${{ secrets.SNYK_ORG }} --fail-on=all

    # =============================================================

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
        aws-region: ${{ env.AWS_REGION }}

    # ==================== DOCKER BUILD & PUSH ====================

    - name: Log in to Amazon ECR
      id: ecr-login
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build, tag, and push image to Amazon ECR
      env:
        ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build \
          --platform linux/amd64 \
          --provenance=false \
          --output type=docker \
          -f Dockerfile \
          -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
          -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
          .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

    # ==================== TERRAFORM ====================

    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v3

    - name: Terraform Init
      working-directory: infra
      run: |
        terraform init \
          -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
          -backend-config="region=${{ env.AWS_REGION }}"

    - name: Terraform Plan
      working-directory: infra
      run: |
        terraform plan \
          -var="aws_region=${{ env.AWS_REGION }}" \
          -var="image_tag=${{ github.sha }}" \
          -target=module.iam \
          -target=module.lambda \
          -target=module.apigateway \
          -target=module.ecr.aws_ecr_repository.this

    - name: Terraform Apply
      working-directory: infra
      run: |
        terraform apply \
          -auto-approve \
          -var="aws_region=${{ env.AWS_REGION }}" \
          -var="image_tag=${{ github.sha }}" \
          -target=module.iam \
          -target=module.lambda \
          -target=module.apigateway \
          -target=module.ecr.aws_ecr_repository.this
