  <!doctype html>
  <html lang="en">
  <head>
    <link rel="stylesheet" href="/static/styles.css"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{% endblock %}</title>
  </head>
  <body>
  <div id="content">
    <span hidden id="results">{{results}}</span>
      {% for result in results %}
        <li hidden class="item">{{ result | replace("[", "") | replace("]", "") | replace("'", "") }}</li>
      {% endfor %}
      
      {% for result in results %}
        <table class="table table-striped">
          <thead>
            <tr>
              <th scope="col">{{ result | replace("[", "") | replace("]", "") | replace("'", "") }}</th>
            </tr>
          </thead>
        </table>
      {% endfor %}
   
    <input type="button" value="download in cvs format" id="download">
  </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script>
document.querySelector('#download').addEventListener('click', () => {
  const results = document.querySelectorAll('.item');
  const resultsList = [];
  
  // Usamos el bucle moderno for...of
  for (const result of results) {
    let itemText = result.textContent;
    // Limpiamos los saltos de línea y diagonales como ya lo hacías
    itemText = itemText.replace(/\n/g, " ").replace(/\//g, ":").trim();
    resultsList.push(itemText);
  }        

  console.log(resultsList);
  
  // Codificamos los parámetros en formato JSON para tu ruta de Flask
  const url = '/download/' + encodeURIComponent(JSON.stringify(resultsList));
  
  // Realizamos la petición en segundo plano para procesar la descarga
  fetch(url)
    .then(response => {
      if (!response.ok) throw new Error('Error al generar el archivo');
      return response.blob(); // Convertimos la respuesta del servidor en un archivo binario/plano
    })
    .then(blob => {
      // Creamos un enlace temporal e invisible en el navegador
      const downloadUrl = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.style.display = 'none';
      a.href = downloadUrl;
      a.download = 'datos_faker.csv'; // Nombre predeterminado que tendrá el archivo del usuario
      
      // Añadimos al documento, disparamos el clic de guardado y limpiamos la memoria
      document.body.appendChild(a);
      a.click();
      window.URL.revokeObjectURL(downloadUrl);
      document.body.removeChild(a);
    })
    .catch(error => {
      console.error('Hubo un problema con la descarga:', error);
      alert('No se pudo procesar la descarga del archivo.');
    });
});

    </script>
  </body>
</html>
